<!doctype html>
<title>Slider checks</title>
<style>
  body{margin:20px;font-family:sans-serif}
  label{display:block;margin:12px 0}
  input[type=range]{width:240px}
  #aria{width:240px;height:24px;background:#eee}
  #aria:focus{outline:2px solid #06c}
</style>
<p>Prices are shown in USD. Max price $500 per night.</p>
<label>Max price <input id="price" type="range" min="0" max="500" step="10" value="150"></label>
<label>Min price <input id="minp" type="range" min="0" max="500" step="10" value="100"></label>
<label>Max stay price <input id="maxp" type="range" min="0" max="500" step="10" value="400"></label>
<div id="aria" role="slider" tabindex="0" aria-label="Rating" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7">7</div>
<script>
  const price = document.getElementById('price');
  const aria = document.getElementById('aria');
  price.addEventListener('input', () => { window.priceMoves = (window.priceMoves || 0) + 1; });
  aria.addEventListener('keydown', e => {
    let value = Number(aria.getAttribute('aria-valuenow'));
    if (e.key === 'ArrowRight') value += 1;
    else if (e.key === 'ArrowLeft') value -= 1;
    else if (e.key === 'Home') value = 0;
    else if (e.key === 'End') value = 10;
    else return;
    value = Math.max(0, Math.min(10, value));
    aria.setAttribute('aria-valuenow', String(value));
    aria.textContent = String(value);
    window.ariaMoves = (window.ariaMoves || 0) + 1;
    e.preventDefault();
  });
</script>
