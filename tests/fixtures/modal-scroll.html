<!doctype html>
<html>
<head><meta charset="utf-8"><title>Modal scroll</title></head>
<body>
<div style="height:3000px">tall page behind the dialog</div>
<dialog open aria-modal="true" aria-label="Dates">
  <div id="list" style="height:120px;overflow-y:auto">
    <p>row one of the scrolling list</p>
    <p>row two of the scrolling list</p>
    <p>row three of the scrolling list</p>
    <p>row four of the scrolling list</p>
    <p>row five of the scrolling list</p>
    <p>row six of the scrolling list</p>
    <p>row seven of the scrolling list</p>
    <p>row eight of the scrolling list</p>
  </div>
  <button>Cancel</button>
  <button>Done</button>
</dialog>
</body>
</html>
